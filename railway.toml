[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash scripts/railway-start.sh"
healthcheckPath = "/up"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10


[deploy]
healthcheckPath = "/healthy"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"