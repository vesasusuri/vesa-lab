# PHP provider auto-adds nodejs + npm-9_x from the nix-npm-overlay, which conflicts
# (two npm derivations writing docs/lib/index.js). Use apt for Node/npm instead.
providers = ["php"]

[phases.setup]
nixPkgs = [
  "nginx",
  "tesseract",
  "poppler_utils",
]
aptPkgs = ["nodejs", "npm"]

[phases.install]
cmds = [
  "bash scripts/nixpacks-build-debug.sh",
  "composer install --no-dev --optimize-autoloader",
  "npm ci",
  "chmod -R ug+rwx storage bootstrap/cache"
]

[phases.build]
cmds = [
  "npm run build",
  "npm prune --omit=dev"
]

[start]
cmd = "bash scripts/railway-start.sh"
