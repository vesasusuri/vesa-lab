providers = []

[phases.setup]
nixPkgs = [
  "(php84.withExtensions (pe: pe.enabled ++ [pe.all.pdo_mysql]))",
  "php84Packages.composer",
  "nginx",
  "tesseract",
  "poppler_utils",
]
aptPkgs = ["nodejs", "npm"]

[phases.install]
cmds = [
  "bash scripts/nixpacks-build-debug.sh",
  "composer install --no-dev --optimize-autoloader",
  "npm ci",
  "chmod -R ug+rwx storage bootstrap/cache"
]

[phases.build]
cmds = [
  "npm run build",
  "npm prune --omit=dev"
]

[start]
cmd = "bash scripts/railway-start.sh"
